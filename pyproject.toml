[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polite-fetch"
version = "0.1.0"
description = "Politeness-first three-tier HTTP fetcher: rate-limited, Retry-After honoring, with auto-escalation to curl_cffi (Tier-2) and Playwright (Tier-3) on WAF detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = []
keywords = ["http", "scraping", "polite", "rate-limit", "retry-after", "anti-bot", "curl_cffi", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
tier2 = ["curl_cffi>=0.7"]
tier3 = ["playwright>=1.40", "browserforge>=1.2"]
mcp = ["fastmcp>=2.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
all = ["polite-fetch[tier2,tier3,mcp,dev]"]

[project.urls]
Repository = "https://github.com/M00C1FER/polite-fetch"
Issues = "https://github.com/M00C1FER/polite-fetch/issues"

[project.scripts]
polite-fetch = "polite_fetch.cli:main"
polite-fetch-mcp = "polite_fetch.mcp_server:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
